name: CI Frontend

on:
    pull_request:
        paths:
            - frontend/**
    push:
        paths:
            - frontend/**

defaults:
    run:
        working-directory: ./frontend

jobs:
    lint-and-test:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v4
        - name: Install pnpm
          uses: pnpm/action-setup@v4
          with:
            version: 10

        - name: Use Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache-dependency-path: frontend/pnpm-lock.yaml
            cache: 'pnpm'

        - name: Install dependencies
          run: pnpm install
        
        - name: Lint
          run: pnpm run lint:check
        
        - name: Test
          run: pnpm run test