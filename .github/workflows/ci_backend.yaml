name: CI Backend

on:
    pull_request:
        paths:
            - backend/**
    push:
        paths:
            - backend/**

defaults:
    run:
        working-directory: ./backend

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - name: Install Go
              uses: actions/setup-go@v3
              with:
                  go-version: 1.23

            - name: Go Format
              run: gofmt -s -w . && git diff --exit-code

            - name: Go Tidy
              run: go mod tidy && git diff --exit-code

            - name: Go Build
              run: go build -o=/dev/null cmd/api/main.go

            - name: Go Test
              run: go test -v -count=1 -race -shuffle=on ./...
